<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Register — DiabetesPrediction</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
<link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}"/>
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="logo">🩺</div>
            <h1>Diabetes Prediction</h1>
            <p>CNN-Powered Early Detection System</p>
        </div>
        <div class="auth-title">Create Account</div>
        <div class="error-msg" id="error-msg"></div>
        <div class="success-msg" id="success-msg"></div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter your username"/>
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email"/>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Min 6 characters"/>
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirm-password" placeholder="Re-enter your password"/>
        </div>
        <button class="btn-auth" onclick="registerUser()" id="register-btn">
            Create Account
        </button>
        <div class="auth-switch">
            Already have an account? <a href="/login">Login here</a>
        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
