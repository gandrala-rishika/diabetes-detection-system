
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diabetes-springboot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: diabetes-springboot
  template:
    metadata:
      labels:
        app: diabetes-springboot
    spec:
      containers:
        - name: springboot
          image: diabetes-registry:5000/diabetes-springboot:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: FLASK_BASE_URL
              value: "http://diabetes-flask:5001"
---
apiVersion: v1
kind: Service
metadata:
  name: diabetes-springboot
spec:
  selector:
    app: diabetes-springboot
  ports:
    - port: 8081
      targetPort: 8081
  type: NodePort
